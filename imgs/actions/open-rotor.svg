<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- Rotor/dial symbol: circle with indicator and tick marks -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer dial circle -->
    <circle cx="36" cy="36" r="24"/>
    <!-- Inner circle -->
    <circle cx="36" cy="36" r="4"/>
    <!-- Indicator line pointing up-right -->
    <line x1="39" y1="33" x2="52" y2="20"/>
    <!-- Tick marks around the dial -->
    <line x1="36" y1="12" x2="36" y2="16"/>
    <line x1="36" y1="56" x2="36" y2="60"/>
    <line x1="12" y1="36" x2="16" y2="36"/>
    <line x1="56" y1="36" x2="60" y2="36"/>
    <!-- Diagonal ticks -->
    <line x1="19" y1="19" x2="22" y2="22"/>
    <line x1="53" y1="19" x2="50" y2="22"/>
    <line x1="19" y1="53" x2="22" y2="50"/>
    <line x1="53" y1="53" x2="50" y2="50"/>
  </g>
</svg>
